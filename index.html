<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Título, descrição, canonical e Open Graph de cada página: preenchidos por src/site/head.ts. -->
    <!--page-head-->

    <!-- Aplica o tema antes da primeira pintura, evitando o "piscar" claro no modo escuro. Mesma chave de src/hooks/useTheme.ts. -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('theme'))
        var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
